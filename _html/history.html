<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — Household Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/history.css">
</head>
<body>
  <div class="page-wrap">

    <header class="page-header">
      <div>
        <h1>Task <span>History</span></h1>
        <div class="subtitle">Completion analytics and activity log</div>
      </div>
      <nav class="nav">
        <a href="/admin" class="nav-link">⚙️ Admin</a>
        <a href="/" class="nav-link">🏠 Home</a>
      </nav>
    </header>

    <!-- Filters -->
    <div class="history-filters">
      <span class="filter-label">Filter:</span>
      <select id="filter-person" class="form-select" style="width:180px">
        <option value="">All people</option>
      </select>
      <select id="filter-days" class="form-select" style="width:150px">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30">Last 30 days</option>
      </select>
    </div>

    <!-- Dynamic Content -->
    <div id="history-container">
      <div class="loading-state"><span class="spinner"></span><span>Loading history…</span></div>
    </div>

  </div>

  
  <script type="module" src="/js/history.js"></script>
</body>
</html>
