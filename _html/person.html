<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/person.css">
</head>
<body>
  <div class="page-wrap">
    <!-- Header -->
    <header class="page-header">
      <div>
        <div class="person-hero">
          <div class="person-avatar" id="person-avatar">
            <span id="person-emoji">👤</span>
          </div>
          <div>
            <h1><span id="person-name">Loading…</span>'s Tasks</h1>
            <div class="person-date" id="person-date"></div>
          </div>
        </div>
      </div>
      <a href="/" class="btn btn-ghost btn-sm">← Home</a>
    </header>

    <!-- Progress -->
    <div class="progress-summary">
      <div class="progress-count" id="progress-done">0</div>
      <div style="font-family:var(--font-display);font-size:2rem;color:var(--text-muted);line-height:1;flex-shrink:0">/</div>
      <div class="progress-count" id="progress-total" style="color:var(--text-muted)">0</div>
      <div class="progress-right">
        <div class="progress-label" id="progress-label">Loading tasks…</div>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- Tasks -->
    <div id="tasks-container">
      <div class="loading-state">
        <span class="spinner"></span>
        <span>Fetching your tasks…</span>
      </div>
    </div>
  </div>

  
  <script type="module" src="/js/person.js"></script>
</body>
</html>
